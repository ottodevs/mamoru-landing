name = "mamoru-lol"
compatibility_date = "2026-09-25"
main = "src/worker.ts"

workers_dev = true
preview_urls = true

routes = [
  { pattern = "mamoru.lol", custom_domain = true },
  { pattern = "www.mamoru.lol", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Address list. Keys are hashes. Values stay in this account.
[[kv_namespaces]]
binding = "WAITLIST"
id = "69293a22f249404e9e0a1bca6878252e"

# One welcome note from notify@mamoru.lol. No other sender.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["notify@mamoru.lol"]
